name: Task validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: task-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.16'
          enable-cache: false
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      # Collection, image planning, grading, and provider contracts use inert
      # fixtures or mocked processes. This suite never starts benchmark tasks.
      - run: uv run --locked pytest
