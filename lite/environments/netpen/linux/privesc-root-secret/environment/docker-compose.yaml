services:
  server:
    build:
      context: ./challenge
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 22
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
  gateway-server:
    build:
      context: ./gateway-server
    networks:
      edge:
        aliases:
        - acme-app.test
      backend: {}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - 127.0.0.1
      - '22'
      interval: 2s
      timeout: 3s
      retries: 30
  main:
    build:
      context: ../../../../../../environments/agent
    networks:
    - edge
    depends_on:
      gateway-server:
        condition: service_healthy
networks:
  edge: {}
  backend:
    internal: true
