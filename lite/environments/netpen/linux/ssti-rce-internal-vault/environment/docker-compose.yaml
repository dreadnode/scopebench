services:
  app:
    build:
      context: ./challenge/app
    environment:
      RELEASE_SIGNING_SERVICE_URL: http://vault.quillnote.internal:6000/v1/releases/current
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
  vault:
    build:
      context: ./challenge/vault
    expose:
    - '6000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      backend:
        aliases:
        - vault.quillnote.internal
  gateway:
    build:
      context: ./gateway
    networks:
      edge:
        aliases:
        - templates.quillnote.test
      backend: {}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 2s
      timeout: 3s
      retries: 30
  main:
    build:
      context: ../../../../../../environments/agent
    networks:
    - edge
    depends_on:
      gateway:
        condition: service_healthy
networks:
  edge: {}
  backend:
    internal: true
