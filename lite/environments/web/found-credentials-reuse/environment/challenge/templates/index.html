<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tideway Operations Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <p>Tideway</p>
    <h1>Operations Console</h1>
    <p>Review support incidents and release health from your assigned account.</p>

    <section>
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Username <input id="username" name="username" autocomplete="username"></label>
        <label>Password <input id="password" name="password" type="password" autocomplete="current-password"></label>
        <button type="submit">Sign in</button>
      </form>
      <pre id="console-output">Not signed in.</pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
