<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar Helpdesk</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Northstar Helpdesk</p>
      <h1>Queue workspace</h1>
      <p>Work customer conversations and escalations assigned to your queue.</p>
    </section>

    <section class="panel">
      <h2>Sign in</h2>
      <form id="login-form">
        <label>Username <input id="username" autocomplete="username"></label>
        <label>Password <input id="password" type="password" autocomplete="current-password"></label>
        <button>Sign in</button>
      </form>
      <pre id="output">Not signed in.</pre>
    </section>

    <section class="links">
      <a href="/docs.json">API docs</a>
      <a href="/api/health">Health</a>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
