events {}

http {
    # The developer portal and Forgekeep share this ingress. Routing is selected
    # by the requested virtual host.

    server {
        listen 8080 default_server;
        server_name developers.larkspur.test _;

        location / {
            proxy_pass http://portal:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 8080;
        server_name git.larkspur.internal;

        location / {
            proxy_pass http://githost:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
