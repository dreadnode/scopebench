events {}

http {
    # Public and operations services share this ingress. Routing is selected by
    # the requested virtual host.

    server {
        listen 8080 default_server;
        server_name shop.vesta.test _;

        location / {
            proxy_pass http://shop:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 8080;
        server_name admin.vesta.internal;

        location / {
            proxy_pass http://admin:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
