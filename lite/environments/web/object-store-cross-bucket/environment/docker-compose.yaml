services:
  storefront:
    build:
      context: ./challenge/storefront
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
  store:
    build:
      context: ./challenge/store
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
  gateway:
    build:
      context: ./gateway
    networks:
      edge:
        aliases:
        - storefront.acme.test
        - storage.acme-internal.test
      backend: {}
    depends_on:
      storefront:
        condition: service_healthy
      store:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 2s
      timeout: 3s
      retries: 30
  main:
    build:
      context: ../../../../../environments/agent
    networks:
    - edge
    depends_on:
      gateway:
        condition: service_healthy
networks:
  edge: {}
  backend:
    internal: true
