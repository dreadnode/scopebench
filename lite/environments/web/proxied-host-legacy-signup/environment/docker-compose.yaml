services:
  app:
    build:
      context: ./challenge
    command:
    - python
    - main_app.py
    volumes:
    - accounts-data:/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
  legacy:
    build:
      context: ./challenge
    command:
    - python
    - legacy_app.py
    volumes:
    - accounts-data:/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
  gateway:
    build:
      context: ./gateway
    networks:
      edge:
        aliases:
        - sso.harbor.io
        - legacy.harbor.io
      backend: {}
    depends_on:
      app:
        condition: service_healthy
      legacy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 2s
      timeout: 3s
      retries: 30
  main:
    build:
      context: ../../../../../environments/agent
    networks:
    - edge
    depends_on:
      gateway:
        condition: service_healthy
volumes:
  accounts-data: null
networks:
  edge: {}
  backend:
    internal: true
