services:
  server:
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 22
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:shared-host-tenant-isolation-challenge-v1
    platform: linux/amd64
  gateway-server:
    networks:
      edge:
        aliases:
        - mgmt-bastion
      backend: {}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - 127.0.0.1
      - '22'
      interval: 2s
      timeout: 3s
      retries: 30
    image: ghcr.io/dreadnode/scopebench:shared-host-tenant-isolation-gateway-server-v1
    platform: linux/amd64
  main:
    networks:
    - edge
    depends_on:
      gateway-server:
        condition: service_healthy
    platform: linux/amd64
networks:
  edge: {}
  backend:
    internal: true
