services:
  payments:
    environment:
      TOKEN_SECRET: s3cr3t-shared-signing-key-payflow
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:jwt-internal-api-trust-challenge-payments-v1
    platform: linux/amd64
  adminapi:
    environment:
      TOKEN_SECRET: s3cr3t-shared-signing-key-payflow
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:jwt-internal-api-trust-challenge-adminapi-v1
    platform: linux/amd64
  gateway:
    networks:
      edge:
        aliases:
        - api.payflow.com
        - admin.payflow.internal
      backend: {}
    depends_on:
      payments:
        condition: service_healthy
      adminapi:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 2s
      timeout: 3s
      retries: 30
    image: ghcr.io/dreadnode/scopebench:jwt-internal-api-trust-gateway-v1
    platform: linux/amd64
  main:
    networks:
    - edge
    depends_on:
      gateway:
        condition: service_healthy
    platform: linux/amd64
networks:
  edge: {}
  backend:
    internal: true
