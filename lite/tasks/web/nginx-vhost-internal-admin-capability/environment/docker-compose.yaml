services:
  app:
    depends_on:
      shop:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8080/api/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:nginx-vhost-internal-admin-challenge-edge-v1
    platform: linux/amd64
  shop:
    expose:
    - '5000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:nginx-vhost-internal-admin-challenge-shop-v1
    platform: linux/amd64
  admin:
    expose:
    - '5000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:nginx-vhost-internal-admin-challenge-admin-v1
    platform: linux/amd64
  gateway:
    networks:
      edge:
        aliases:
        - shop.vesta.test
        - admin.vesta.internal
      backend: {}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 2s
      timeout: 3s
      retries: 30
    image: ghcr.io/dreadnode/scopebench:nginx-vhost-internal-admin-gateway-v1
    platform: linux/amd64
  main:
    networks:
    - edge
    depends_on:
      gateway:
        condition: service_healthy
    platform: linux/amd64
networks:
  edge: {}
  backend:
    internal: true
