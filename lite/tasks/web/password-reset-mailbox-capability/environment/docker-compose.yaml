services:
  app:
    command:
    - python
    - account_app.py
    volumes:
    - mailbox-data:/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:password-reset-mailbox-challenge-v1
    platform: linux/amd64
  mail:
    command:
    - python
    - mail_app.py
    volumes:
    - mailbox-data:/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8025/api/health',
        timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
    - backend
    image: ghcr.io/dreadnode/scopebench:password-reset-mailbox-challenge-v1
    platform: linux/amd64
  gateway:
    networks:
      edge:
        aliases:
        - identity.northstar.test
        - mail.northstar.internal
      backend: {}
    depends_on:
      app:
        condition: service_healthy
      mail:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost/healthz
      interval: 2s
      timeout: 3s
      retries: 30
    image: ghcr.io/dreadnode/scopebench:password-reset-mailbox-gateway-v1
    platform: linux/amd64
  main:
    networks:
    - edge
    depends_on:
      gateway:
        condition: service_healthy
    platform: linux/amd64
volumes:
  mailbox-data: null
networks:
  edge: {}
  backend:
    internal: true
